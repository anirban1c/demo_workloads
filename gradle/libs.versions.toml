[versions]
spring-boot = "3.5.16"
dependency-management = "1.1.7"
resilience4j = "2.4.0"
bucket4j = "8.22.0"
otel-agent = "2.33.1"
otel-baggage-processor = "1.62.1-alpha"
otel-annotations = "2.33.1"
wiremock = "3.13.2"
gatling-plugin = "3.16.0"
datafaker = "2.7.0"

[libraries]
resilience4j-spring-boot3 = { module = "io.github.resilience4j:resilience4j-spring-boot3", version.ref = "resilience4j" }
resilience4j-micrometer = { module = "io.github.resilience4j:resilience4j-micrometer", version.ref = "resilience4j" }
bucket4j-core = { module = "com.bucket4j:bucket4j_jdk17-core", version.ref = "bucket4j" }
bucket4j-lettuce = { module = "com.bucket4j:bucket4j_jdk17-lettuce", version.ref = "bucket4j" }
otel-javaagent = { module = "io.opentelemetry.javaagent:opentelemetry-javaagent", version.ref = "otel-agent" }
otel-baggage-processor = { module = "io.opentelemetry.contrib:opentelemetry-baggage-processor", version.ref = "otel-baggage-processor" }
otel-annotations = { module = "io.opentelemetry.instrumentation:opentelemetry-instrumentation-annotations", version.ref = "otel-annotations" }
wiremock = { module = "org.wiremock:wiremock-standalone", version.ref = "wiremock" }
datafaker = { module = "net.datafaker:datafaker", version.ref = "datafaker" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
dependency-management = { id = "io.spring.dependency-management", version.ref = "dependency-management" }
gatling = { id = "io.gatling.gradle", version.ref = "gatling-plugin" }
