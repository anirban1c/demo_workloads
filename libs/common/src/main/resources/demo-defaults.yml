# Shared defaults for every service: imported with spring.config.import=classpath:demo-defaults.yml
spring:
  threads.virtual.enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:19092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        linger.ms: 5
    consumer:
      auto-offset-reset: earliest
      max-poll-records: ${KAFKA_MAX_POLL_RECORDS:20}     # caps in-flight work per consumer thread
      properties:
        max.poll.interval.ms: 600000
    listener:
      concurrency: ${KAFKA_CONCURRENCY:4}                # consumer threads per listener (throttle #2)
      ack-mode: record
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/demo}
    username: ${DB_USER:demo}
    password: ${DB_PASSWORD:demo}
    hikari.maximum-pool-size: 20
  jackson:
    default-property-inclusion: non_null
    serialization.write-dates-as-timestamps: false

server:
  shutdown: graceful

management:
  endpoints.web.exposure.include: health,info,metrics,prometheus,circuitbreakers,retries,ratelimiters,bulkheads
  endpoint.health.probes.enabled: true
  health.circuitbreakers.enabled: false

# Fictitious SaaS vendors. In compose every vendor hostname is a network alias of the WireMock container,
# so the OTel agent's peer-service mapping turns each into its own node on the Tempo service graph.
demo:
  vendors:
    acme-identity: {base-url: "${VENDOR_BASE_ACME_IDENTITY:http://localhost:8089}/identity", read-timeout: 2s}
    paylane:       {base-url: "${VENDOR_BASE_PAYLANE:http://localhost:8089}/paylane", read-timeout: 3s}
    corebank:      {base-url: "${VENDOR_BASE_COREBANK:http://localhost:8089}/corebank", read-timeout: 2s}
    kycheck:       {base-url: "${VENDOR_BASE_KYCHECK:http://localhost:8089}/kyc", read-timeout: 3s}
    relatecrm:     {base-url: "${VENDOR_BASE_RELATECRM:http://localhost:8089}/crm", read-timeout: 2s}
    insight-ai:    {base-url: "${VENDOR_BASE_INSIGHT_AI:http://localhost:8089}/insights-ai", read-timeout: 8s}

# Resilience per vendor (instance name == vendor name). Throttle #3: rate limiters match vendor quotas.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: TIME_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 20
        failure-rate-threshold: 50
        slow-call-duration-threshold: 2s
        slow-call-rate-threshold: 80
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions: [com.demo.workloads.common.vendor.VendorUnavailableException]
        ignore-exceptions: [com.demo.workloads.common.vendor.VendorRejectedException]
    instances:
      insight-ai: {slow-call-duration-threshold: 6s}
  retry:
    configs:
      default:
        max-attempts: 2                 # one quick in-process retry; the long ones go through retry topics
        wait-duration: 200ms
        retry-exceptions: [com.demo.workloads.common.vendor.VendorUnavailableException]
  ratelimiter:
    configs:
      default:
        limit-for-period: 100
        limit-refresh-period: 1s
        timeout-duration: 2s
    instances:
      insight-ai: {limit-for-period: 15}   # the AI vendor has the tightest quota
      kycheck: {limit-for-period: 30}
  bulkhead:
    configs:
      default:
        max-concurrent-calls: 50
        max-wait-duration: 500ms
    instances:
      insight-ai: {max-concurrent-calls: 16}
